# Mod identity shared by every Minecraft version.
#
# Each <version>/settings.gradle loads this file and injects it into every
# project, so the mod version and identity can never drift between the supported
# Minecraft builds. Minecraft, loader, and Java toolchain versions live in each
# <version>/gradle.properties.
#
# Every property consumed by a resource template must also be listed in
# build-logic/src/main/groovy/multiloader-common.gradle expandProps.
version=1.0.0
group=com.nightbeam.tbos
mod_name=Remnants: Roguelite Dungeons
mod_author=Mahou
mod_id=tbos
license=All Rights Reserved
credits=
description=A roguelite dungeon RPG in the Fractured Archive. Attune Memory Keys with Distortions, push deeper or bank your Renown, earn generated Relics, grow the Archivist's Codex and delve with your party.
