# Keep in sync with common/src/main/resources/tbos.accesswidener — the two files
# say the same thing to two different toolchains. The common project compiles
# against unpatched vanilla, so it needs each widening even where NeoForge
# already ships one of its own.

# CreativeModeTab$Output is protected in vanilla. ModCreativeModeTabs builds the
# mod's tab in common code, so the display-items callback has to be nameable.
public net.minecraft.world.item.CreativeModeTab$Output

# BlockEntityType's Set<Block> constructor is private in vanilla; ModBlockEntities
# calls it directly for the three utility block entities.
public net.minecraft.world.level.block.entity.BlockEntityType$BlockEntitySupplier
public net.minecraft.world.level.block.entity.BlockEntityType <init>(Lnet/minecraft/world/level/block/entity/BlockEntityType$BlockEntitySupplier;Ljava/util/Set;)V

# StairBlock's constructor is protected in vanilla; ModBlocks builds ARCHIVE_STAIRS.
public net.minecraft.world.level.block.StairBlock <init>(Lnet/minecraft/world/level/block/state/BlockState;Lnet/minecraft/world/level/block/state/BlockBehaviour$Properties;)V
