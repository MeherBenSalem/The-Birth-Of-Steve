// Composite root. Each Minecraft version under <version>/ is its own Gradle
// build with its own loader plugin versions, so Loom and ModDevGradle never have
// to agree across targets. `gradlew build` here fans out to all of them; to
// drive a single version use `gradlew -p <version> <task>`.

// Must match the folder name of the project, or else IDEA may complain
// (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = 'The Birth of Steve'

includeBuild('1.20.1')
includeBuild('26.1.2')
includeBuild('26.2')
includeBuild('1.21.1')
