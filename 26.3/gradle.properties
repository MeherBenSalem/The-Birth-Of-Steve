org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Java remains target-local: this target compiles on Java 25, unlike 1.21.1.
java_version=25

# Minecraft and loader versions for this target only. Mod identity (version,
# group, mod_id, description, ...) lives in ../shared/mod.properties.

# Common
minecraft_version=26.3
minecraft_version_range=[26.3, 26.4)
## Minecraft version the 'common' project compiles against, see
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.165.0+26.3
fabric_loader_version=0.19.5

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.3.0.97
neoforge_loader_version_range=[4,)
