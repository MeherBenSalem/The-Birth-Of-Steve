plugins {
    // see https://maven.fabricmc.net/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml for new versions
    // Pinned to the 1.17 line: Loom 1.18+ requires Gradle plugin API 9.7 and
    // cannot resolve on the repository's Gradle 9.5 root wrapper, which drives
    // this build both directly (-p 26.3) and from the root composite. 1.17.21
    // is that line's 26.3 maintenance release. See overrides/README.md.
    id 'net.fabricmc.fabric-loom' version '1.17.21' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.148' apply false
}
