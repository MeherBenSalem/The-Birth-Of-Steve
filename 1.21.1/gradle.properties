org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft and loader versions for this target only. Mod identity lives in
# ../shared/mod.properties. Java stays target-local because 1.21.1 needs Java 21
# while the 26.x targets require Java 25.
java_version=21

# Common (baseline values from MultiLoader-Template-1.21.1.zip)
minecraft_version=1.21.1
minecraft_version_range=[1.21.1, 1.22)
neo_form_version=1.21.1-20240808.144430
parchment_minecraft=1.21
parchment_version=2024.11.10

# Fabric
fabric_version=0.109.0+1.21.1
fabric_loader_version=0.16.9

# NeoForge
neoforge_version=21.1.80
neoforge_loader_version_range=[4,)
