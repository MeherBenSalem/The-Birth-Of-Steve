plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

def commonResourcesDir = sharedSourceDir('common', 'resources')
def accessTransformer = resolveSharedFile('common', 'resources', 'META-INF/accesstransformer.cfg')

neoForge {
    version = neoforge_version
    if (accessTransformer.exists()) {
        accessTransformers.from(accessTransformer.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // ModDev's 1.21.1 run type creates the matching runGameTestServer task.
        gameTestServer {
            type = 'gameTestServer'
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', this.file('src/generated/resources/').getAbsolutePath(),
                    '--existing', commonResourcesDir.getAbsolutePath()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}
