name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Builds :common, :neoforge and :fabric. :common:check pulls in the
      # 1,000-seed dungeon simulation.
      - name: Build
        run: ./gradlew clean build --stacktrace

      # The GameTest suite is the real regression gate. It runs on NeoForge:
      # the test functions and their datapack instances are common code, so a
      # green run here covers the Fabric jar's tests too.
      - name: GameTests
        run: ./gradlew :neoforge:runGameTestServer --stacktrace --console=plain
