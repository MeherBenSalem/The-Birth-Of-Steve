# Dual-publish NightBeam mods/plugins to Modrinth + CurseForge on version tags.
#
# Each loader jar is its own Modrinth version:
#   version_number: 0.6.0+mc26.1.2+fabric
# Never attach multiple loader jars to one Modrinth version.
#
# Org/repo secrets:
#   MODRINTH_TOKEN
#   CURSEFORGE_TOKEN
#   CURSEFORGE_API_KEY
#
# Repo variables:
#   MODRINTH_ID
#   CURSEFORGE_ID
#
# Usage after a release build is ready:
#   git tag v1.2.3 && git push --tags

name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version (without v) when not tagging
        required: false
      dry_run:
        description: Skip uploads if true
        required: false
        default: "false"

jobs:
  # Resolved once so every Minecraft version publishes under the same release
  # version, and so the matrix stays in step with the composite build.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "Provide a v*.*.* tag or workflow_dispatch version" >&2
            exit 1
          fi

      - name: Discover Minecraft versions
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          MATRIX=$(sed -n "s/^includeBuild('\(.*\)')/\1/p" settings.gradle \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          test "$MATRIX" != "[]"
          echo "$MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Uploads are not transactional; a failure on one target must not cancel a
      # sibling that may already be mid-upload.
      fail-fast: false
      # One release at a time, so a partial run is easy to reason about.
      max-parallel: 1
      matrix:
        minecraft: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: publish (${{ matrix.minecraft }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew 2>/dev/null || true
          ./gradlew -p ${{ matrix.minecraft }} build --no-daemon

      - name: Find jars
        id: jars
        shell: bash
        run: |
          # Loader is inferred from the filename below, so the loader-agnostic
          # :common jar must not be uploaded - it would be mislabelled.
          mapfile -t JARS < <(find "${{ matrix.minecraft }}/fabric" "${{ matrix.minecraft }}/neoforge" "${{ matrix.minecraft }}/forge" \
            -type f -path "*/build/libs/*.jar" \
            ! -name "*-sources.jar" ! -name "*-javadoc.jar" \
            ! -name "*-dev.jar" ! -name "*-dev-shadow.jar" \
            ! -name "*-common-*.jar" 2>/dev/null | sort)
          if [ ${#JARS[@]} -eq 0 ]; then
            echo "No jars in ${{ matrix.minecraft }}/*/build/libs" >&2
            exit 1
          fi
          printf '%s\n' "${JARS[@]}"
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "list<<$EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${JARS[@]}" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Upload Modrinth + CurseForge
        if: ${{ inputs.dry_run != 'true' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          VERSION: ${{ needs.plan.outputs.version }}
          JAR_LIST: ${{ steps.jars.outputs.list }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MODRINTH_ID:-}" && test -n "${CURSEFORGE_ID:-}"
          node tools/publish-local.mjs "$GITHUB_WORKSPACE" "$VERSION"
