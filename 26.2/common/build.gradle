plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

// Resolved up here on purpose: inside the moddev `neoForge` DSL the closure
// delegates to the extension, which cannot see the convention plugin's helpers.
def accessTransformer = resolveSharedFile('common', 'resources', 'META-INF/accesstransformer.cfg')

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    if (accessTransformer.exists()) {
        accessTransformers.from(accessTransformer.absolutePath)
    }
}

dependencies {
    // Fabric and NeoForge both bundle Fabric Mixin, so it is safe to use it in common
    // If you need to update, check what version they are using to see what is compatible
    // https://github.com/neoforged/NeoForge/blob/26.2.x/gradle.properties#L37
    // https://github.com/FabricMC/fabric-loader/blob/master/gradle.properties#L12
    compileOnly('net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7')
    // Fabric and NeoForge both bundle MixinExtras, so it is safe to use it in common
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.3'))
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

// One directory each under shared/ and, when this version overrides something,
// under overrides/ - so no singleFile here. multiloader-common excludes the
// shadowed shared copies from the consuming tasks.
artifacts {
    sourceSets.main.java.srcDirs.each { if (it.directory) commonJava it }
    sourceSets.main.resources.srcDirs.each { if (it.directory) commonResources it }
}

// The 1,000-seed dungeon invariant gate. ArchiveRunGenerator is a pure seeded
// function over validated settings and never touches a world, so this runs on
// the plain vanilla classpath with no loader and no Minecraft runtime.
tasks.register('runDungeonSimulation', JavaExec) {
    group = 'verification'
    description = 'Runs the 1,000-seed Echoes of the Past dungeon invariant simulation.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.nightbeam.tbos.run.ArchiveDungeonSimulation'
    args '1000'
}

tasks.named('check').configure {
    dependsOn tasks.named('runDungeonSimulation')
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}
