pluginManagement {
    // Scoped to this build's plugin resolution. Every version's build-logic
    // publishes the same plugin ids (multiloader-common/-loader), so including
    // it at the top level offers this copy to the whole composite and the root
    // build applies one version's conventions to all of them.
    includeBuild('build-logic')
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Must match the folder name of the project, or else IDEA may complain
// (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = '26.2'
include('common')
include('fabric')
include('neoforge')
