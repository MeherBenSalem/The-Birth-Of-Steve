# Daemon settings for the composite build. Each <version>/gradle.properties
# repeats them, because `gradlew -p <version>` never reads this file.
#
# Mod identity lives in shared/mod.properties.
# Minecraft and loader versions live in <version>/gradle.properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
